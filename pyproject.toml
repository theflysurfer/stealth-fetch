[project]
name = "stealth-fetch"
version = "0.1.0"
description = "Cascading anti-bot HTML fetcher — direct → curl_cffi → nodriver → patchright → camoufox → SaaS. Library + HTTP microservice."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
curlffi = ["curl_cffi>=0.7"]
stealth = ["nodriver>=0.40"]
# Seul moteur qui franchit Akamai Bot Manager (cf. #4).
patchright = ["patchright>=1.40"]
camoufox = ["camoufox[geoip]>=0.4", "playwright>=1.40"]
saas = []  # no extra deps — plain httpx
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
all = [
    "curl_cffi>=0.7",
    "nodriver>=0.40",
    "patchright>=1.40",
    "camoufox[geoip]>=0.4",
    "playwright>=1.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
stealth-fetch = "stealth_fetch.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "B", "E711", "E712"]

[tool.pyright]
pythonVersion = "3.11"
reportCallIssue = "error"
